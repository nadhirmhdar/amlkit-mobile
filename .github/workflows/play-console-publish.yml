# Builds a signed release AAB and publishes it straight to a Google Play
# Console track -- the "separate, larger trust decision" android-release.yml's
# header comment deferred. Made possible without ever holding a Play Console
# service-account key: this authenticates via Workload Identity Federation
# (same mechanism as the amlkit repo's own Cloud Run deploy -- see that
# repo's .github/workflows/source-canary.yml and
# scripts/setup_github_deploy_auth.sh), exchanging GitHub's own OIDC token
# for short-lived GCP credentials. Run scripts/setup_github_play_auth.sh once
# to provision the service account and Workload Identity Pool provider this
# depends on, then invite the printed service account email in Play Console
# (Setup -> API access -> Users and permissions) with whatever release
# permissions you intend to use here.
#
# Deliberately workflow_dispatch-only, same reasoning as android-release.yml:
# publishing is a decision, not something that should happen automatically
# because a commit landed. Choosing `production` as the track is itself the
# confirmation this workflow needed to run at all, so it passes playcli.py
# --yes unconditionally rather than asking again inside a non-interactive job.
#
# Requires the same four keystore secrets as android-release.yml (see that
# workflow's header) plus two repository variables setup_github_play_auth.sh
# prints: GCP_WIF_PROVIDER, GCP_PLAY_SERVICE_ACCOUNT.

name: Publish to Play Console

on:
  workflow_dispatch:
    inputs:
      apiBaseUrl:
        description: "amlkit server URL this build points at (trailing slash required)"
        required: true
      versionCode:
        description: "Integer versionCode -- must be strictly higher than the last version uploaded to Play"
        required: true
      versionName:
        description: "Human-readable version, e.g. 1.0.1"
        required: true
      track:
        description: "Play Console track to publish to"
        required: true
        default: "internal"
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
      releaseNotes:
        description: "Release notes shown to testers/users"
        required: false

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    name: Build signed AAB and publish to ${{ inputs.track }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 secret is not set -- see docs/google-play-steps.md 'Automated release builds'"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/amlkit-upload.p12"

      - name: Write local signing properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          {
            echo "RELEASE_STORE_FILE=$RUNNER_TEMP/amlkit-upload.p12"
            echo "RELEASE_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$KEY_PASSWORD"
          } > local.properties

      - name: Build signed release bundle
        run: |
          ./gradlew bundleRelease \
            -PapiBaseUrl="${{ inputs.apiBaseUrl }}" \
            -PversionCode="${{ inputs.versionCode }}" \
            -PversionName="${{ inputs.versionName }}" \
            --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: amlkit-release-${{ inputs.versionName }}
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      # Workload Identity Federation: no service-account key ever exists
      # anywhere -- see scripts/setup_github_play_auth.sh for the one-time
      # GCP-side setup this depends on.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r tools/play-console/requirements.txt

      - name: Publish to Play Console
        run: |
          python3 tools/play-console/playcli.py upload \
            app/build/outputs/bundle/release/app-release.aab \
            --track "${{ inputs.track }}" \
            --release-notes "${{ inputs.releaseNotes }}" \
            --yes
