name: Diagnostic - Play Console tracks

on:
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_SERVICE_ACCOUNT }}

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r tools/play-console/requirements.txt

      - name: List tracks
        run: python3 tools/play-console/playcli.py tracks list

      - name: App details
        run: python3 tools/play-console/playcli.py details show
